name: WebKit acceptance (scheduled)

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

env:
  CI: '1'

jobs:
  webkit-acceptance:
    name: WebKit full-stack acceptance
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install SQLite-capable backend dependencies
        run: |
          uv python install 3.12
          managed_python="$(uv python find --no-project --managed-python --resolve-links 3.12)"
          uv sync --locked --python "${managed_python}" --extra dev

      - name: Verify Python resources and SQLite extension loading
        run: uv run --no-sync python scripts/packaged_python_smoke.py

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build production frontend
        working-directory: frontend
        run: pnpm build

      - name: Install Playwright WebKit
        working-directory: frontend
        run: pnpm exec playwright install --with-deps webkit

      - name: Run WebKit acceptance tests
        working-directory: frontend
        env:
          ACCEPTANCE_WEBKIT: '1'
        run: pnpm exec playwright test --config playwright.acceptance.config.ts --project webkit

      - name: Upload acceptance report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-acceptance-report
          path: acceptance-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload acceptance traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-acceptance-traces
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
