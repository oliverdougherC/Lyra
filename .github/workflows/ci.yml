name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Check backend formatting
        run: uv run --extra dev ruff format --check backend scripts

      - name: Lint backend
        run: uv run --extra dev ruff check backend scripts

      - name: Run backend tests
        run: uv run --extra dev pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend smoke tests
        run: pnpm test:e2e

  python-security:
    # Locked Python production-dependency vulnerability gate (PLA-297). Audits the exact
    # pinned production graph from uv.lock with the same command developers run locally:
    #   uv run --extra security python scripts/python_security_gate.py
    name: Python production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install security tooling
        run: uv sync --extra security

      - name: Scan locked production dependencies
        run: uv run --extra security python scripts/python_security_gate.py --json-report python-audit-evidence.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-evidence
          path: python-audit-evidence.json
          if-no-files-found: warn

  # Single, stable aggregate gate. This is the ONLY status check required to merge into
  # main (see docs/security-and-ci-gates.md). It depends on every real lane and fails
  # unless all of them succeeded, so the internal jobs above can be split or renamed
  # without silently dropping protection: the required check context stays "CI Gate".
  # When PLA-292's bounded full-stack acceptance job lands, add it to `needs` below.
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [backend, frontend, python-security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required lanes succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Upstream lane results: ${RESULTS}"
          IFS=',' read -ra outcomes <<< "${RESULTS}"
          failed=0
          for result in "${outcomes[@]}"; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required CI lane did not succeed (result: ${result})."
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "CI Gate: FAIL — not every required lane passed."
            exit 1
          fi
          echo "CI Gate: PASS — backend, frontend, and Python security all succeeded."
