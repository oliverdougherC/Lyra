name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CI: '1'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Check authoritative release metadata
        run: python scripts/release_metadata.py --check

      - name: Check backend formatting
        run: uv run --extra dev ruff format --check backend scripts packaging

      - name: Lint backend
        run: uv run --extra dev ruff check backend scripts packaging

      - name: Run backend tests
        run: uv run --extra dev pytest

  backend-targeted:
    name: Backend targeted regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Run targeted backend regression tests
        run: >
          uv run --extra dev pytest
          backend/tests/test_acceptance_lifecycle.py
          backend/tests/test_api_health.py
          backend/tests/test_api_settings.py
          backend/tests/test_exa.py
          backend/tests/test_llama_server_lifecycle.py
          backend/tests/test_desktop_bootstrap.py
          backend/tests/test_desktop_import.py
          backend/tests/test_desktop_migration.py
          backend/tests/test_desktop_paths.py
          backend/tests/test_desktop_resource_report.py
          backend/tests/test_packaged_soak_harness.py
          backend/tests/test_active_reference_absence.py
          backend/tests/test_packaged_python_smoke.py
          backend/tests/test_helper_reclaim.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Release Please version behavior
        run: |
          npm install --prefix "$RUNNER_TEMP/release-please-check" --ignore-scripts --no-audit --no-fund release-please@17.3.0
          cd ..
          node scripts/release/test_release_please.cjs "$RUNNER_TEMP/release-please-check/node_modules/release-please"

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Run frontend unit tests
        run: pnpm test

      - name: Verify design contrast contract
        run: python ../scripts/check_contrast.py

      - name: Build frontend
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Install Playwright Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run frontend smoke tests
        run: pnpm test:e2e

      - name: Run WebKit external-navigation tests
        env:
          PLAYWRIGHT_ENABLE_WEBKIT: '1'
          PLAYWRIGHT_FRONTEND_PORT: '4187'
        run: pnpm exec playwright test e2e/external-links.spec.ts --project=webkit

  acceptance:
    name: Full-stack acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run real-stack acceptance tests
        run: ./scripts/run-acceptance.sh

      - name: Upload acceptance report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload acceptance traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  python-security:
    name: Python production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install security tooling
        run: uv sync --extra security

      - name: Scan locked production dependencies
        run: uv run --extra security python scripts/python_security_gate.py --json-report python-audit-evidence.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-evidence
          path: python-audit-evidence.json
          if-no-files-found: warn

  packaged-python-smoke:
    name: Frozen Python build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install packaging dependencies
        run: |
          uv python install 3.12
          managed_python="$(uv python find --no-project --managed-python --resolve-links 3.12)"
          uv sync --python "${managed_python}" --extra packaging

      - name: Build frozen backend
        run: uv run --extra packaging pyinstaller --clean --noconfirm packaging/lyra_backend.spec

      - name: Verify packaged resources and authenticated startup
        run: |
          uv run python scripts/packaged_python_smoke.py
          uv run python scripts/frozen_backend_smoke.py dist/lyra-backend/lyra-backend

  resource-report:
    name: Component resource report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate deterministic component inventory
        run: >
          python scripts/desktop_resource_report.py
          --root backend=backend
          --root frontend=frontend
          --root scripts=scripts
          --output component-resource-report.json

      - name: Upload component resource report
        uses: actions/upload-artifact@v4
        with:
          name: component-resource-report
          path: component-resource-report.json
          if-no-files-found: error

  active-reference-absence:
    name: Active reference absence scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check local documentation links
        run: python scripts/check_docs.py

      - name: Scan active docs and workflows
        run: python scripts/check_active_references.py

  rust-desktop:
    name: Rust desktop checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Tauri compile-time frontend fixture
        run: |
          mkdir -p frontend/dist
          cp frontend/index.html frontend/dist/index.html

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Lint Rust workspace
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

  desktop-macos-artifact:
    name: Desktop macOS artifact
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install backend packaging dependencies
        run: |
          uv python install 3.12
          managed_python="$(uv python find --no-project --managed-python --resolve-links 3.12)"
          uv sync --python "${managed_python}" --extra packaging

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build and stage frozen backend
        run: |
          uv run --extra packaging pyinstaller --clean --noconfirm packaging/lyra_backend.spec
          uv run python scripts/frozen_backend_smoke.py dist/lyra-backend/lyra-backend
          uv run python packaging/stage_sidecar.py

      - name: Stage pinned llama runtime into the bundle
        run: |
          uv run python scripts/stage_llama_runtime.py
          test -n "$(find src-tauri/resources/llama -name 'llama-server' -type f | head -1)"

      - name: Collect distribution notices
        run: |
          pnpm --dir frontend licenses list --prod --json > "$RUNNER_TEMP/frontend-licenses.json"
          uv run python scripts/collect_distribution_notices.py --frontend-inventory "$RUNNER_TEMP/frontend-licenses.json"

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Build unsigned desktop app
        working-directory: frontend
        run: pnpm tauri:build --bundles app --no-sign --ci

      - name: Embed exact unsigned review identity before creating the DMG
        run: >
          uv run python scripts/review_candidate_receipt.py prepare
          --app src-tauri/target/release/bundle/macos/Lyra.app

      - name: Build reviewable unsigned DMG
        run: |
          version="$(cat version.txt)"
          ./scripts/build_dmg.sh \
            src-tauri/target/release/bundle/macos/Lyra.app \
            "review-artifact/Lyra_${version}_aarch64_UNSIGNED_REVIEW.dmg"

      - name: Generate desktop resource report
        run: |
          bundle_root="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${bundle_root}" ]; then
            echo "::error::No .app bundle was produced."
            exit 1
          fi
          uv run python scripts/desktop_resource_report.py --root app="${bundle_root}" --output review-artifact/desktop-resource-report.json

      - name: Record unsigned candidate hashes and source receipts
        run: |
          version="$(cat version.txt)"
          uv run python scripts/review_candidate_receipt.py receipt \
            --dmg "review-artifact/Lyra_${version}_aarch64_UNSIGNED_REVIEW.dmg"

      - name: Upload unsigned review candidate and receipts
        id: review-artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyra-desktop-macos-unsigned-review
          path: review-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Link remotely retrievable unsigned review candidate
        env:
          ARTIFACT_URL: ${{ steps.review-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.review-artifact.outputs.artifact-digest }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## Unsigned review candidate\n\n")
              summary.write(f"[Download DMG and receipts]({os.environ['ARTIFACT_URL']})\n\n")
              summary.write("**Not Developer ID signed, notarized, or approved for distribution.**\n\n")
              summary.write("The receipt records the exact build/PR head, PR base, and separate CI test-merge SHA.\n\n")
              summary.write(f"Actions archive SHA-256: `{os.environ['ARTIFACT_DIGEST']}`\n")
          PYTHON

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - backend
      - backend-targeted
      - frontend
      - acceptance
      - python-security
      - packaged-python-smoke
      - resource-report
      - active-reference-absence
      - rust-desktop
      - desktop-macos-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required lanes succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Upstream lane results: ${RESULTS}"
          IFS=',' read -ra outcomes <<< "${RESULTS}"
          failed=0
          for result in "${outcomes[@]}"; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required CI lane did not succeed (result: ${result})."
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "CI Gate: FAIL - not every required lane passed."
            exit 1
          fi
          echo "CI Gate: PASS - all required lanes succeeded."
