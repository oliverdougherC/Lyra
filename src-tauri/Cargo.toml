[package]
name = "lyra-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "lyra_desktop"
path = "src/lib.rs"

[[bin]]
name = "lyra-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.6.3", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
