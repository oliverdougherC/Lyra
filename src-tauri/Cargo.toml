[package]
name = "lyra-desktop"
version = "0.2.0-beta.0"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "lyra_desktop"
path = "src/lib.rs"

[[bin]]
name = "lyra-desktop"
path = "src/main.rs"

[build-dependencies]
serde_json = "1.0.145"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
flate2 = "1.1.10"
libc = "0.2.177"
minisign-verify = "0.2.5"
plist = "1.7.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
tar = "0.4.46"
tauri = { version = "2.6.3", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.11.0"
tokio = { version = "1.53.1", features = ["sync", "macros", "time"] }

# macOS 27's dyld rejects stripped host proc-macro dylibs (mis-aligned LINKEDIT
# string pool). Keep build-time tools intact; shipped app optimization and
# stripping are unchanged. Reproduced for ctor, thiserror, phf and serde.
[profile.release.build-override]
strip = "none"
