[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra"
version = "0.1.0"
description = "Local-first study tutor with retrieval-grounded chat"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  # Starlette parses multipart uploads through this. FastAPI raises at import time, not
  # at request time, when a route declares an UploadFile without it installed.
  "python-multipart==0.0.32",
  "pymupdf==1.28.0",
  "sqlite-vec==0.1.9",
  "keyring==25.7.0",
  "httpx==0.28.1",
  "huggingface-hub==1.26.0",
  # Solution verification. SymPy runs only inside the bounded subprocess in
  # backend/tools/cas.py, never in the request or worker process: its parser evaluates,
  # and the expressions it is given come from a model that has read an untrusted upload.
  "sympy==1.14.0",
  "pint==0.25.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.1"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Prose, not source. Ruff otherwise reformats the Python snippets inside the specs.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "RET", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["backend"]
