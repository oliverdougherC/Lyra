# Force one katex version everywhere: rehype-katex's ^0.16.0 range would otherwise
# resolve a nested 0.16.x whose emitted classes mismatch the 0.18.x stylesheet we import.
overrides:
  katex: 0.18.1
  # DOMPurify 3.4.13–3.4.15 leaves hook-detached handlers armed in IN_PLACE mode
  # (GHSA-p98j-92pf-mc4p). Pin the existing Milkdown transitive dependency.
  'dompurify@': 3.4.16
  # fast-uri <3.1.8 carries SSRF / host-confusion and host-normalization advisories
  # (GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # GHSA-jqff-g426-hqxp, GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g,
  # GHSA-hrr3-gc8f-f4qj). It is pulled
  # in via @hookform/resolvers -> ajv 8.20.0 (fast-uri: ^3.0.1), which pnpm
  # previously resolved to a vulnerable 3.x; pin the patched line without touching the
  # declared ajv range.
  'fast-uri@': 3.1.8

allowBuilds:
  # These reviewed packages install platform-specific binaries used by the
  # frontend toolchain. Every other dependency build remains denied by pnpm
  # 11's strictDepBuilds default.
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - fast-uri@3.1.8
